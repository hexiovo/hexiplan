", "Astra-high；Sol共3个、Luna共6个、浏览器2个、高内存1个；最多两轮修复"], ["确认与恢复", "原有需求／正式方案／总步骤／本步计划／验收关口继续生效"], ["12套模板与页面功能", "基础12套模板及导出核心保留；新结构使用附加的render_layout.py。"], ["离线使用", "规则与渲染无需联网；真实文献检索等任务仍需要其实际授权工具"], ["无全局安装", "不写AGENTS.md、Skill目录、项目配置、默认模型或PATH"], ["适配而非原样打包", "9份上游模块思路的本地适配版；不包含上游整套CLI／插件"], ["未执行实机联调", "未在你的Windows、登录账户或Word版本验证；运行时必须如实预检"]]}, {"type": "links", "items": [{"title": "本地测试记录", "href": "docs/测试记录.md", "description": "查看已执行范围和未执行事项"}, {"title": "模块路由索引", "href": "modules/MODULE_ROUTER.md", "description": "Astra及相关角色使用的紧凑索引"}]}]}], "content_sha256": "951c014c99ea293d0044f252772dc903cebbf5fac7221e44126e415eee569203"}</script><script>/* HexiPlan offline report renderer + genuine OOXML exporter. No external dependencies. */
'use strict';
(function(){
 const data=JSON.parse(document.getElementById('report-data').textContent);
 const meta=data.meta||{}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const inline=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
 const $=id=>document.getElementById(id);
 const title=data.title||'HexiPlan 报告'; document.title=title+' · HexiPlan';
 const badge=s=>`<span class="badge ${/^[A-Z_]+$/.test(s||'')?s:''}">${esc(s)}</span>`;
 function safeLink(url){url=String(url||'');if(/^(https?:\/\/)/i.test(url))return url;if(!/^[a-z][a-z0-9+.-]*:/i.test(url)&&!url.startsWith('//')&&!/[\x00-\x1f]/.test(url))return url;return '#';}
 const knownKinds={requirements:'需求理解与确认',solution:'正式方案确认',roadmap:'整体项目步骤',step_plan:'当前步骤规划',acceptance:'阶段交付验收',research:'研究方法比较',academic:'学术结果报告',ui_review:'界面方案评审',status:'状态与恢复',guide:'使用说明',change:'变更与阻塞',delivery:'最终交付',catalog:'模板与使用入口'};
 const kind=knownKinds[data.type]||'任务文档';$('top-label').textContent='HEXIPLAN / '+kind;
 let chips=[meta.is_template?'<span class="chip warn">模板预览 · 非项目成果</span>':'<span class="chip green">'+esc(meta.status||'待审核')+'</span>'];
 if(meta.source_type)chips.push('<span class="chip '+(meta.source_type==='SYNTHETIC_ONLY'?'warn':'')+'">'+esc(meta.source_type)+'</span>');
 chips.push('<span class="chip">离线 HTML</span>','<span class="chip">可导出 Word</span>');
 $('cover').innerHTML=`<div class="eyebrow">${esc(data.kicker||'HexiPlan / '+kind)}</div><h1>${esc(title)}</h1><p class="subtitle">${inline(data.subtitle||'')}</p><div class="chips">${chips.join('')}</div><div class="meta-grid">${[['任务',meta.run_id||'待创建'],['步骤 / 关口',meta.step||meta.gate||'—'],['版本','v'+(meta.revision||1)],['更新',meta.date||'按任务填写']].map(([l,v])=>`<div><div class="meta-label">${esc(l)}</div><div class="meta-value">${esc(v)}</div></div>`).join('')}</div>`;
 if(meta.is_template)$('template-warning').innerHTML='<div class="notice">这是可复用框架，所有“待填写”内容均为占位，不是执行结果、真实研究数据或已批准方案。正式报告由 Sol 填充 JSON 后生成；不要重新编写页面样式。</div>';
 const allShots=[], selected=new Set();
 function shotNode(im){const idx=allShots.push(im)-1;const src=/^data:image\/(png|jpeg);base64,/.test(im.data_uri||'')?im.data_uri:'';
 return `<article class="shot">${src?`<button class="shot-image" data-shot="${idx}" aria-label="放大 ${esc(im.title||'截图')}"><img src="${esc(src)}" alt="${esc(im.alt||im.title||'截图')}" loading="lazy"></button>`:'<div class="empty">待加入真实截图<br>不以效果图替代运行证据</div>'}<div class="shot-caption"><div class="shot-title">${esc(im.title||'截图')}</div><div class="shot-meta">${esc(im.label||'')} ${esc(im.captured_at||'')}<br>${esc(im.caption||'')}</div>${src?`<label class="no-print"><input type="checkbox" data-compare="${idx}"> 加入对比</label>`:''}</div></article>`;}
 function block(b){
  switch(b.type){
   case 'text':return (b.paragraphs||[b.text||'']).map(t=>'<p>'+inline(t)+'</p>').join('');
   case 'callout':return `<div class="callout ${b.level==='warning'?'warning':b.level==='danger'?'danger':''}">${b.title?'<strong>'+esc(b.title)+'</strong><br>':''}${inline(b.text||'')}</div>`;
   case 'kv':return '<dl class="kv">'+(b.items||[]).map(x=>`<dt>${esc(x.label)}</dt><dd>${inline(x.value)}</dd>`).join('')+'</dl>';
   case 'table':return `${b.number?`<div class="table-label">${esc(b.number)}</div>`:''}${b.title?`<div class="table-title">${inline(b.title)}</div>`:''}<div class="table-wrap"><table class="data-table ${b.apa?'apa':''}"><thead><tr>${(b.columns||[]).map(c=>'<th scope="col">'+inline(c)+'</th>').join('')}</tr></thead><tbody>${(b.rows||[]).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>${b.note?'<p class="table-note">'+inline(b.note)+'</p>':''}`;
   case 'metrics':return '<div class="metrics">'+(b.items||[]).map(x=>`<div class="metric"><div class="value">${esc(x.value)}</div><div class="label">${esc(x.label)}</div>${x.note?'<div class="note">'+esc(x.note)+'</div>':''}</div>`).join('')+'</div>';
   case 'timeline':return '<div class="steps">'+(b.items||[]).map((x,i)=>`<div class="step"><div class="step-num">${String(i+1).padStart(2,'0')}</div><div><div class="step-title">${esc(x.title)}</div><div class="step-desc">${inline(x.description||'')}</div></div>${badge(x.status||'PLANNED')}</div>`).join('')+'</div>';

   case 'checklist':return '<div class="checklist">'+(b.items||[]).map(x=>`<div class="checkitem">${badge(x.status||'NOT_RUN')}<span>${inline(x.text||'')}${x.detail?'<br><span class="table-note">'+inline(x.detail)+'</span>':''}</span></div>`).join('')+'</div>';
   case 'gallery':return `<div class="gallery-head"><span class="table-note">${esc(b.title||'截图总体预览')} · ${(b.images||[]).length} 项</span><button class="compare-btn no-print">对比所选截图（2 张）</button></div><div class="gallery">${(b.images||[]).map(shotNode).join('')}</div>${!(b.images||[]).length?'<div class="empty">暂无截图。这里将汇总真实界面、运行结果与必要过程截图。</div>':''}`;
   case 'figure':return `<figure>${b.number?'<div class="table-label">'+esc(b.number)+'</div>':''}${b.title?'<div class="table-title">'+inline(b.title)+'</div>':''}${b.data_uri&&/^data:image\/(png|jpeg);base64,/.test(b.data_uri)?'<img src="'+esc(b.data_uri)+'" alt="'+esc(b.alt||b.title||'图形')+'">':'<div class="empty">待加入真实图形；不生成虚构研究结果。</div>'}<figcaption>${inline(b.caption||'')}</figcaption>${b.note?'<p class="figure-note">'+inline(b.note)+'</p>':''}</figure>`;
   case 'code':return '<pre class="code">'+esc(b.text)+'</pre>';
   case 'links':return '<div class="links">'+(b.items||[]).map(x=>`<a class="linkcard" href="${esc(safeLink(x.href))}"><strong>${esc(x.title)}</strong><span>${esc(x.description||'')}</span></a>`).join('')+'</div>';
   case 'references':return '<ol class="references">'+(b.items||[]).map(x=>`<li>${inline(x.text||'')}${x.url?' <a href="'+esc(safeLink(x.url))+'" target="_blank" rel="noopener noreferrer">来源</a>':''}</li>`).join('')+'</ol>';
   default:return '<div class="notice">未识别区块：'+esc(b.type)+ '。请更新结构化报告，勿忽略缺失内容。</div>';
  }

 usable.forEach((im,i)=>{const b=document.createElement('button');b.className='asset-item';b.setAttribute('aria-label','查看 '+(im.title||'截图'));const image=document.createElement('img');image.src=im.data_uri;image.alt=im.alt||im.title||'截图';const t=document.createElement('span');t.textContent=String(i+1).padStart(2,'0')+'　'+(im.title||'截图');b.append(image,t);b.onclick=()=>{showFull(false);paint(i);};$('asset-list').appendChild(b);});
 if(usable.length){paint(0);$('asset-count').textContent=usable.length+' 份截图';}
 else{$('asset-count').textContent='暂无截图';$('evidence-view').hidden=true;$('full-content').hidden=false;$('view-mode').disabled=true;}
 $('stage-enlarge').onclick=()=>{const im=usable[picture];if(!im)return;$('dialog-title').textContent=im.title||'截图';$('dialog-images').className='dialog-images';$('dialog-images').replaceChildren();const image=document.createElement('img');image.src=im.data_uri;image.alt=im.alt||im.title||'截图';$('dialog-images').appendChild(image);$('lightbox').showModal();};
 $('view-mode').onclick=()=>showFull($('full-content').hidden);
 $('compare-open').onclick=()=>{showFull(true);const g=document.querySelector('.gallery');if(g)g.closest('.section').scrollIntoView({behavior:'smooth'});else notice('本报告尚无可对比截图。');};
 const check=document.querySelector('#sections .checklist');if(check)$('aux-checks').appendChild(check.cloneNode(true));else $('aux-checks').textContent='完整验证结果见报告正文。';
 const log=document.querySelector('#sections .code');if(log)$('aux-logs').appendChild(log.cloneNode(true));else $('aux-logs').textContent='本报告未包含运行日志。';
 document.querySelectorAll('[data-aux]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-aux]').forEach(x=>x.classList.toggle('active',x===b));['checks','logs'].forEach(id=>$('aux-'+id).hidden=id!==b.dataset.aux);});
}
// Preview reports get an explicit NOT_SUBMITTED notes panel, never a real gate token.
if(!$('approval').children.length&&data.meta?.is_template){
 const box=document.createElement('section');box.className='review-panel';box.innerHTML='<div class="subheading"><span class="status-dot"></span>布局样例 · 非业务验收</div><h2>需要你决定的事</h2><p>这套结构是否方便你读方案、查看截图和给出意见？样例中的项目与状态仅用于布局演示。</p><label for="preview-notes">你的意见</label><textarea id="preview-notes" placeholder="例如：保留右侧确认区，正文更宽一些……"></textarea><button class="primary" id="copy-layout-feedback">复制布局意见</button><details><summary>这不是批准按钮</summary><p>只复制文字，不连接 Codex、不改任务状态、不安装工具。</p></details>';
 $('approval').appendChild(box);
 const key='hexiplan-layout-preview:'+layout;try{$('preview-notes').value=localStorage.getItem(key)||'';}catch(e){}
 $('preview-notes').oninput=()=>{try{localStorage.setItem(key,$('preview-notes').value);}catch(e){}};
 $('copy-layout-feedback').onclick=()=>copy('HexiPlan UI 结构意见：'+document.body.dataset.layoutName+'（'+layout+'），统一淡绿色。\n'+$('preview-notes').value+'\n此消息只反馈页面结构，不批准业务实施或安装任何具体 MCP。');
}
if($('copy-layout'))$('copy-layout').onclick=()=>copy('我确认 HexiPlan 的报告页面采用“'+document.body.dataset.layoutName+'”（layout='+layout+'），统一淡绿色。该选择只用于报告布局，不代替业务软件 UI 确认，不批准任何业务步骤。请记录后复用现成布局，不重写 HTML/CSS/JS。');
if($('layout-label'))$('layout-label').textContent=document.body.dataset.layoutName;
// Scrolling/tabs only changes presentation. Print and DOCX still include the entire document.
window.addEventListener('beforeprint',()=>{sections.forEach(s=>s.hidden=false);if($('full-content'))$('full-content').hidden=false;});
window.addEventListener('afterprint',()=>active(current));
active(0);
})();
</script></body></html>
