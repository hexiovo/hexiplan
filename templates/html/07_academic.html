<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>HexiPlan</title><style>:root{--ink:#1e293b;--muted:#64748b;--line:#dfe5ed;--paper:#fff;--bg:#f2f5f8;--accent:#0e766e;--nav:#142d35;--soft:#e8f4f1;--warn:#fff5df;--danger:#a2323b;--radius:14px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:15px;line-height:1.75}button,input,textarea{font:inherit}a{color:var(--accent);text-underline-offset:3px}button,.button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:8px 13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:13px}button:hover,.button:hover{border-color:var(--accent);color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8fc8bd;outline-offset:3px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover{background:#095a54;color:white}.sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;padding:29px 22px;background:var(--nav);color:#cfdee1;overflow:auto}.brand{font-size:23px;color:#fff;letter-spacing:.5px;font-weight:650}.brand small{font-size:10px;letter-spacing:2px;display:block;color:#8ec5bc;font-weight:400}.side-label{font-size:10px;letter-spacing:2px;color:#8eb0b5;margin:34px 0 11px}.sidebar nav a{display:block;color:#d7e6e8;font-size:13px;text-decoration:none;border-radius:7px;padding:8px 9px;margin:3px -9px;line-height:1.5;overflow-wrap:anywhere}.sidebar nav a:hover{background:#23444c}.side-note{font-size:11px;line-height:1.8;color:#9bb7bc;border-top:1px solid #325059;padding-top:18px;margin-top:24px}.main{margin-left:236px}.toolbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line :16px;border:1px solid var(--line);border-radius:9px;color:var(--ink);text-decoration:none;display:block}.linkcard:hover{border-color:var(--accent);background:#f8fcfb}.linkcard strong{display:block;font-size:13px}.linkcard span{display:block;font-size:11px;color:var(--muted);margin-top:5px}.references{padding-left:0;list-style:none;font-size:12px}.references li{padding:9px 0 9px 20px;text-indent:-20px;overflow-wrap:anywhere}.approval{margin-top:25px;border:1px solid #a5ccc5;background:#f4fbf9;border-radius:var(--radius);padding:24px 30px}.approval h2{font-size:18px;margin:0 0 8px}.approval p{font-size:12px;color:#536c69}.approval-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.approval textarea{display:block;width:100%;min-height:90px;padding:12px;border:1px solid var(--line);border-radius:8px;margin:12px 0;background:#fff;font-size:12px;resize:vertical}.approval-code{font-size:11px;overflow-wrap:anywhere;white-space:pre-wrap;background:#fff;border:1px solid #d7e9e4;border-radius:6px;padding:12px}.footer{font-size:11px;color:var(--muted);padding:25px 0;border-top:1px solid var(--line);margin-top:28px;display:flex;gap:20px;justify-content:space-between}.toast{position:fixed;right:22px;bottom:22px;background:var(--nav);color:white;padding:12px 18px;border-radius:10px;z-index:100;font-size:13px;box-shadow:0 5px 25px #0002}.hidden{display:none!important}dialog{border:0;border-radius:12px;padding:20px;width:min(1350px,95vw);max-height:94vh;background:#f7f9fb}dialog::backdrop{background:#122731c9}.dialog-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;align-items:center}.dialog-title{font-size:14px;font-weight:600}.dialog-images{display:grid;gap:14px}.dialog-images.two{grid-template-columns:1fr 1fr}.dialog-images img{width:100%;height:auto;max-height:75vh;object-fit:contain}.dialog-note{font-size:11px;color:var(--muted);margin-top:7px}.mobile-brand{display:none}.progress-strip{height:5px;background:#e3ecea;margin-top:20px;border-ra <body><aside class="sidebar"><div class="brand">HexiPlan<small>PLAN · CONFIRM · BUILD</small></div><div class="side-label">本页目录 / CONTENTS</div><nav id="toc" aria-label="文档目录"></nav><div class="side-note">显式启用 · 逐级确认<br>离线阅读 · 内容可追溯<br><br>预览与批注不会启动代理，<br>也不会自动批准任何任务。</div></aside><main class="main"><div class="toolbar"><div><span class="label-small" id="top-label">HEXIPLAN / REVIEW</span><span class="mobile-brand">HexiPlan</span></div><div class="toolbar-tools"><input id="search" type="search" placeholder="搜索本页内容" aria-label="搜索本页内容"><button id="export-word">导出 Word .docx</button><button id="print-btn">打印 / PDF</button><button id="save-data">保存 JSON</button></div></div><div class="page"><header id="cover" class="cover"></header><div id="template-warning"></div><div id="sections"></div><div id="approval"></div><footer class="footer"><span>HexiPlan 3.0 · 本地离线文档</span><span id="footer-meta"></span></footer></div></main><dialog id="lightbox"><div class="dialog-head"><span class="dialog-title" id="dialog-title"></span><button id="close-dialog">关闭 ×</button></div><div id="dialog-images" class="dialog-images"></div></dialog><div id="toast" class="toast hidden" role="status"></div><script type="application/json" id="report-data">{"schema_version": 1, "type": "academic", "title": "数据处理结果 · APA 风格报告", "subtitle": "正文、统计表与图形使用同一份已计算结果；模拟验证数据与真实研究结果必须明确区分。", "meta": {"run_id": "TEMPLATE", "gate": "", "step": "", "revision": 1, "date": "按任务填写", "status": "DRAFT", "source_type": "TEMPLATE", "is_template": true}, "sections": [{"title": "数据来源与方法", "blocks": [{"type": "kv", "items": [{"label": "数据来源", "value": "REAL / PUBLIC_BENCHMARK / SYNTHETIC_ONLY：待填写。"}, {"label": "样本与排除", "value": "待填样本量、剔除和缺失处理，不能编造。"}, {"label": "方法与参数", "value": "引用已确认的分析方案及实际实现版本。"}, {"label": "结果可复现信息", "value": "待填脚本、输入哈希、环境、参数和随机种子（适用时）。"}]}]}, {"title": "结果叙述", "blocks": [{"type": "text", "text": "待按实际分析撰写结果。需要时报告 *M*、*SD*、效应估计及其置信区间、检验统计量和 *p*；不适用的统计量不填，不为排版自动开展新分析。"}, {"type": "callout", "text": "本模板未包含实际研究结果。若使用合成数据验证，应把标题和数据来源标为 SYNTHETIC_ONLY，不能据此声称真实被试效果。", "title": "", "level": "warning"}]}, {"title": "描述与统计结果表", "blocks": [{"type": "table", "columns": ["条件/变量", "*n*", "*M*", "*SD*", "估计值 / 95% CI"], "rows": [["待填写", "—", "—", "—", "—"]], "apa": true, "number": "Table 1", "title": "Descriptive statistics and estimates", "note": "Note. 数值、单位、CI类型、缺失处理及缩写说明按实际分析填写。“—”代表尚未计算，不是零。"}]}, {"title": "图形与图注", "blocks": [{"type": "figure", "number": "Figure 1", "title": "Outcome visualization", "caption": "待加入真实计算产生的图形，并解释坐标、单位和误差线。", "note": "Note. 不以示意图冒充真实结果。"}]}, {"title": "质量控制、稳健性与限制", "blocks": [{"type": "table", "columns": ["检查", "证据类型", "实际结果", "局限"], "rows": []}, {"type": "text", "text": "呈现真实执行的QC与必要敏感性检查；未执行项目标明，不无止境增加分析。"}]}, {"title": "参考文献", "blocks": [{"type": "references", "items": []}]}], "blocking_questions": [], "content_sha256": "2c858b1086182133f285d7fd954fdac5c9eeb2b2f320aae38ee30a24c63fdb0a"}</script><script>/* HexiPlan offline report renderer + genuine OOXML exporter. No external dependencies. */
'use strict';
(function(){
 const data=JSON.parse(document.getElementById('report-data').textContent);
 const meta=data.meta||{}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const inline=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
 const $=id=>document.getElementById(id);
 const title=data.title||'HexiPlan 报告'; document.title=title+' · HexiPlan';
 const badge=s=>`<span class="badge ${/^[A-Z_]+$/.test(s||'')?s:''}">${esc(s)}</span>`;
 function safeLink(url){url=String(url||'');if(/^(https?:\/\/)/i.test(url))return url;if(!/^[a-z][a-z0-9+.-]*:/i.test(url)&&!url.startsWith('//')&&!/[\x00-\x1f]/.test(url))return url;return '#';}
 const knownKinds={requirements:'需求理解与确认',solution:'正式方案确认',roadmap:'整体项目步骤',step_plan:'当前步骤规划',acceptance:'阶段交付验收',research:'研究方法比较',academic:'学术结果报告',ui_review:'界面方案评审',status:'状态与恢复',guide:'使用说明',change:'变更与阻塞',delivery:'最终交付',catalog:'模板与使用入口'};
 const kind=knownKinds[data.type]||'任务文档';$('top-label').textContent='HEXIPLAN / '+kind;
 let chips=[meta.is_template?'<span class="chip warn">模板预览 · 非项目成果</span>':'<span class="chip green">'+esc(meta.status||'待审核')+'</span>'];
 if(meta.source_type)chips.push('<span class="chip '+(meta.source_type==='SYNTHETIC_ONLY'?'warn':'')+'">'+esc(meta.source_type)+'</span>');
 chips.push('<span class="chip">离线 HTML</span>','<span class="chip">可导出 Word</span>');
 $('cover').innerHTML=`<div class="eyebrow">${esc(data.kicker||'HexiPlan / '+kind)}</div><h1>${esc(title)}</h1><p class="subtitle">${inline(data.subtitle||'')}</p><div class="chips">${chips.join('')}</div><div class="meta-grid">${[['任务',meta.run_id||'待创建'],['步骤 / 关口',meta.step||meta.gate||'—'],['版本','v'+(meta.revision||1)],['更新',meta.date||'按任务填写']].map(([l,v])=>`<div><div class="meta-label">${esc(l)}</div><div class="meta-value">${esc(v)}</div></div>`).join('')}</div>`;
 if(meta.is_template)$('template-warning').innerHTML='<div class="notice">这是可复用框架，所有“待填写”内容均为占位，不是执行结果、真实研究数据或已批准方案。正式报告由 Sol 填充 JSON 后生成；不要重新编写页面样式。</div>';
 const allShots=[], selected=new Set();
 function shotNode(im){const idx=allShots.push(im)-1;const src=/^data:image\/(png|jpeg);base64,/.test(im.data_uri||'')?im.data_uri:'';
 return `<article class="shot">${src?`<button class="shot-image" data-shot="${idx}" aria-label="放大 ${esc(im.title||'截图')}"><img src="${esc(src)}" alt="${esc(im.alt||im.title||'截图')}" loading="lazy"></button>`:'<div class="empty">待加入真实截图<br>不以效果图替代运行证据</div>'}<div class="shot-caption"><div class="shot-title">${esc(im.title||'截图')}</div><div class="shot-meta">${esc(im.label||'')} ${esc(im.captured_at||'')}<br>${esc(im.caption||'')}</div>${src?`<label class="no-print"><input type="checkbox" data-compare="${idx}"> 加入对比</label>`:''}</div></article>`;}
 function block(b){
  switch(b.type){
   case 'text':return (b.paragraphs||[b.text||'']).map(t=>'<p>'+inline(t)+'</p>').join('');
   case 'callout':return `<div class="callout ${b.level==='warning'?'warning':b.level==='danger'?'danger':''}">${b.title?'<strong>'+esc(b.title)+'</strong><br>':''}${inline(b.text||'')}</div>`;
   case 'kv':return '<dl class="kv">'+(b.items||[]).map(x=>`<dt>${esc(x.label)}</dt><dd>${inline(x.value)}</dd>`).join('')+'</dl>';
   case 'table':return `${b.number?`<div class="table-label">${esc(b.number)}</div>`:''}${b.title?`<div class="table-title">${inline(b.title)}</div>`:''}<div class="table-wrap"><table class="data-table ${b.apa?'apa':''}"><thead><tr>${(b.columns||[]).map(c=>'<th scope="col">'+inline(c)+'</th>').join('')}</tr></thead><tbody>${(b.rows||[]).map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>${b.note?'<p class="table-note">'+inline(b.note)+'</p>':''}`;
   case 'metrics':return '<div class="metrics">'+(b.items||[]).map(x=>`<div class="metric"><div class="value">${esc(x.value)}</div><div class="label">${esc(x.label)}</div>${x.note?'<div class="note">'+esc(x.note)+'</div>':''}</div>`).join('')+'</div>';
   case 'timeline':return '<div class="steps">'+(b.items||[]).map((x,i)=>`<div class="step"><div class="step-num">${String(i+1).padStart(2,'0')}</div><div><div class="step-title">${esc(x.title)}</div><div class="step-desc">${inline(x.description||'')}</div></div>${badge(x.status||'PLANNED')}</div>`).join('')+'</div>';
